# keyd: teclado de PC com atalhos de Mac.
# Instalado em /etc/keyd/default.conf por scripts/52-keyd.sh.
# (o keyd não aceita comentário na mesma linha de um atalho)
#
# Nomes do evdev (posição física no teclado PC):
#   leftalt  = tecla ao lado da barra de espaço  -> Cmd
#   leftmeta = tecla seguinte (Windows)          -> Option (Alt)
# Pânico: se algo der errado, <backspace>+<escape>+<enter> desliga o keyd.

[ids]
*

[main]
leftalt = layer(cmd)
leftmeta = layer(opt)

# Cmd age como Ctrl (Cmd+C copia, Cmd+V cola, Cmd+T nova aba...), com estas exceções:
[cmd:C]
# Cmd+Espaço abre o KRunner (Alt+Espaço)
space = A-space
# Cmd+Tab alterna janelas; Cmd+` alterna janelas do mesmo app
tab = A-tab
grave = A-grave
# Cmd+Setas: início/fim da linha e do texto
left = home
right = end
up = C-home
down = C-end
# Cmd+Backspace apaga até o início da linha
backspace = macro(S-home delete)

# Option age como Alt (o tmux usa Alt), e Option+Setas anda por palavras
[opt:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete
